
name: Prismium 26.2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Prismium
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Prismium-26.2
          path: build/libs/*.jar
