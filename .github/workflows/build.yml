
name: Copy Prismium source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Prismium 26.2
        uses: actions/checkout@v4

      - name: Checkout saved Prismium 1.21.11
        uses: actions/checkout@v4
        with:
          repository: almazi4ik/Prismium-1.21.11
          ref: main
          path: source

      - name: Copy project files
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            source/ ./

          rm -rf source

      - name: Commit copied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import saved Prismium source for 26.2 port"
            git push
          fi
